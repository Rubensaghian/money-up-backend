spring.config.import=optional:file:.env[.properties]

spring.application.name=backend

# PLAID
plaid.client-id=${PLAID_CLIENT_ID}
plaid.secret=${PLAID_SANDBOX_SECRET}
plaid.environment=SANDBOX
plaid.webhook=${PLAID_WEBHOOK}

# TOKEN ENCRYPTION

moneyup.token-encryption.secret=${TOKEN_ENCRYPTION_SECRET}
moneyup.token-encryption.salt=${TOKEN_ENCRYPTION_SALT}

# DATABASE
spring.datasource.url=${SUPABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app


